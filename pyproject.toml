[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ciel"
version = "3.0.0"
description = "An PDK builder/version manager for PDKs in the open_pdks format"
authors = ["Mohamed Gaber <me@donn.website>", "Efabless Corporation"]
readme = "Readme.md"
license = "Apache-2.0"
repository = "https://github.com/fossi-foundation/ciel"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
]

[tool.poetry.dependencies]
python = ">=3.8"
click = ">=8,<8.5"
pyyaml = ">=5,<7"
rich = ">=12,<16"
httpx = ">=0.22.0,<0.29"
pcpp = ">=1.2,<2"
zstandard = ">=0.19.0,<1"


[tool.poetry.group.dev.dependencies]
wheel = "*"
ruff = ">=0.16.6,<0.17.0"
mypy = ">=1.9.0,<1.10.0"
types-PyYAML = "*"
types-setuptools = "*"
types-attrs = "*"


[tool.poetry.scripts]
ciel = "ciel.__main__:cli"

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
ignore = [
    # We sort imports vaguely by length
    "I",
    # See GitHub issue #131
    "BLE001",
    # Will need to update like 80 billion annotations
    "FA100", 
    # ihp-sg13 is an invalid module name
    "N999",
    # Noisy
    "DTZ"
]
